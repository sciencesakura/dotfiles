set-option -g escape-time 256
set-option -g history-limit 16384
set-option -g mouse on
set-option -g pane-active-border-style "fg=#6b7089"
set-option -g pane-border-style "fg=#6b7089"
set-option -g prefix C-s
set-option -ga terminal-overrides ',alacritty:RGB'

unbind-key C-b
unbind-key %
unbind-key '"'

bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key p run-shell '(type pbpaste >/dev/null 2>&1 && pbpaste || wl-paste -n) | tmux load-buffer -; tmux paste-buffer'

# List of plugins
set-option -g @plugin 'thewtex/tmux-mem-cpu-load alias=tmux-mem-cpu-load'
set-option -g @plugin 'sciencesakura/tmux-powerline#draft/add-google-cloud'

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'type tpack >/dev/null 2>&1 && tpack init'
